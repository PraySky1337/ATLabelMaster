name: Release Packages

on:
  push:
    tags:
      - 'v*'

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build-packages:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          git \
          qt6-base-dev \
          qt6-base-dev-tools \
          libqt6svg6-dev \
          libopencv-dev \
          libeigen3-dev \
          dpkg-dev \
          rpm

    - name: Extract version
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version $VERSION"

    - name: Build binary
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)

    - name: Build Arch Linux package
      run: |
        cd packaging/arch
        sed -i "s/pkgver=1.2.2/pkgver=${{ steps.version.outputs.VERSION }}/g" PKGBUILD
        makepkg -sf
        mv *.pkg.tar.z* ../../

    - name: Build Debian package
      run: |
        bash packaging/deb/build.sh ${{ steps.version.outputs.VERSION }} amd64

    - name: Build RPM package
      run: |
        bash packaging/rpm/build.sh ${{ steps.version.outputs.VERSION }}

    - name: Create tarball
      run: |
        git archive --format=tar.gz --prefix=labelmaster-${{ steps.version.outputs.VERSION }}/ \
          -o labelmaster-${{ steps.version.outputs.VERSION }}.tar.gz HEAD

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages-${{ steps.version.outputs.VERSION }}
        path: |
          *.deb
          *.rpm
          *.pkg.tar.zst
          *.tar.gz

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          *.deb
          *.rpm
          *.pkg.tar.zst
          *.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
